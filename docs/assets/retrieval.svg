<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="330" viewBox="0 0 1440 330" role="img" aria-labelledby="title desc"><title id="title">Selective retrieval workflow</title><desc id="desc">Read the entry and core, choose relevant notes, then record decisions in a project manifest. Source archives are loaded only when needed.</desc><style>text{font-family:Arial,Helvetica,sans-serif}.mono{font-family:Consolas,monospace}</style><rect width="1440" height="330" fill="#f4f6f8"/><text x="48" y="58" font-size="18" font-weight="700" letter-spacing="1.5" fill="#244ddd">SMALL CONTEXT. DELIBERATE RETRIEVAL.</text><rect x="48" y="98" width="416" height="160" rx="0" fill="#ffffff" stroke="#cdd3df"/><rect x="48" y="98" width="5" height="160" fill="#244ddd"/><text x="72" y="151" font-size="20" font-weight="700" fill="#132039">ENTRY + CORE</text><text x="72" y="199" font-size="20" fill="#4d5b72">Read the short starting rules</text><rect x="512" y="98" width="416" height="160" rx="0" fill="#ffffff" stroke="#cdd3df"/><rect x="512" y="98" width="5" height="160" fill="#244ddd"/><text x="536" y="151" font-size="20" font-weight="700" fill="#132039">SELECTED NOTES</text><text x="536" y="199" font-size="20" fill="#4d5b72">Choose only what the task needs</text><rect x="976" y="98" width="416" height="160" rx="0" fill="#ffffff" stroke="#cdd3df"/><rect x="976" y="98" width="5" height="160" fill="#244ddd"/><text x="1000" y="151" font-size="20" font-weight="700" fill="#132039">PROJECT MANIFEST</text><text x="1000" y="199" font-size="20" fill="#4d5b72">Record decisions and evidence</text><text x="48" y="302" font-size="17" fill="#4d5b72">Source archives stay outside the default reading path. Token reductions are not measured.</text></svg>
