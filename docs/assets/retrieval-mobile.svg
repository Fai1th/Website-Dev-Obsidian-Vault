<svg xmlns="http://www.w3.org/2000/svg" width="720" height="720" viewBox="0 0 720 720" role="img" aria-labelledby="title"><title id="title">Read the entry and core, select relevant notes, record a project manifest.</title><style>text{font-family:Arial,Helvetica,sans-serif}</style><rect width="720" height="720" fill="#f4f6f8"/><text x="42" y="55" font-size="23" font-weight="700" fill="#244ddd">DELIBERATE RETRIEVAL</text><rect x="42" y="90" width="636" height="149" fill="#ffffff" stroke="#cdd3df"/><rect x="42" y="90" width="6" height="149" fill="#244ddd"/><text x="66" y="145" font-size="26" font-weight="700" fill="#132039">ENTRY + CORE</text><text x="66" y="193" font-size="27" fill="#4d5b72">Read the short starting rules</text><rect x="42" y="273" width="636" height="149" fill="#ffffff" stroke="#cdd3df"/><rect x="42" y="273" width="6" height="149" fill="#244ddd"/><text x="66" y="328" font-size="26" font-weight="700" fill="#132039">SELECTED NOTES</text><text x="66" y="376" font-size="27" fill="#4d5b72">Choose what this task needs</text><rect x="42" y="456" width="636" height="149" fill="#ffffff" stroke="#cdd3df"/><rect x="42" y="456" width="6" height="149" fill="#244ddd"/><text x="66" y="511" font-size="26" font-weight="700" fill="#132039">PROJECT MANIFEST</text><text x="66" y="559" font-size="27" fill="#4d5b72">Record decisions and evidence</text><text x="42" y="676" font-size="22" fill="#4d5b72">Load source archives only when needed.</text></svg>
