<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="314" viewBox="0 0 1440 314" role="img" aria-labelledby="title desc"><title id="title">Design, build, verify</title><desc id="desc">Design: 11 genres and page structures. Build: React sources, patterns and adoption recipes. Verify: accessibility, security and performance.</desc><style>text{font-family:Arial,Helvetica,sans-serif}.mono{font-family:Consolas,monospace}</style><rect width="1440" height="314" fill="#132039"/><text x="48" y="69" class="mono" font-size="17" fill="#8dacf9">01 / DESIGN</text><text x="48" y="143" font-size="29" font-weight="700" fill="#ffffff">11 visual directions</text><text x="48" y="183" font-size="21" fill="#c1ccde">Genre rules + page structures</text><path d="M48 233H138" stroke="#8dacf9" stroke-width="3"/><path d="M488 40V274" stroke="#34435b"/><text x="512" y="69" class="mono" font-size="17" fill="#8dacf9">02 / BUILD</text><text x="512" y="143" font-size="29" font-weight="700" fill="#ffffff">React source + examples</text><text x="512" y="183" font-size="21" fill="#c1ccde">Patterns, states + adoption</text><path d="M512 233H602" stroke="#8dacf9" stroke-width="3"/><path d="M952 40V274" stroke="#34435b"/><text x="976" y="69" class="mono" font-size="17" fill="#8dacf9">03 / VERIFY</text><text x="976" y="143" font-size="29" font-weight="700" fill="#ffffff">Professional release checks</text><text x="976" y="183" font-size="21" fill="#c1ccde">Accessibility, security + speed</text><path d="M976 233H1066" stroke="#8dacf9" stroke-width="3"/></svg>
